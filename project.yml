# مشروع Xcode يُولَّد من هذا الملف بأداة XcodeGen (في GitHub Actions).
# لا Mac عند المساعدين، فالملف النصّي هو المرجع، و.xcodeproj يُولَّد ولا يُحفظ في المستودع.
name: DailyWird
options:
  bundleIdPrefix: com.mtech732.dailywird
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
  createIntermediateGroups: true
# iCloud (ش7): إعداد ثالث بصلاحية iCloud، لا يوقّعه إلا حساب المطوّر المدفوع. ويبقى Debug وRelease
# بلا صلاحية، فيُثبَّت التطبيق بالحساب المجاني كما هو (القرار 28). انظر App/Model/Cloud.swift.
configs:
  Debug: debug
  Release: release
  iCloud: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  DailyWird:
    type: application
    platform: iOS
    sources:
      - path: App
      # جدول الحدود القرآني (6.1، 4.4): ملف مُعدّ البيانات يُضمَّن في التطبيق كما هو.
      - path: data/quran-boundaries.json
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: الورد اليومي
        CFBundleDevelopmentRegion: ar
        CFBundleLocalizations: [ar]
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        # شاشة البداية (§17.2، ذ47): App/Resources/LaunchScreen.storyboard بأصولها في Assets.xcassets.
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # إشعارات CloudKit الصامتة تجلب تغييرات iCloud والتطبيق في الخلفية (بناء iCloud).
        UIBackgroundModes: [remote-notification]
        # لا تشفير خاص في التطبيق، فلا يُسأل عنه عند كل رفع إلى TestFlight.
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - IBMPlexSansArabic-Regular.ttf
          - IBMPlexSansArabic-Medium.ttf
          - IBMPlexSansArabic-SemiBold.ttf
          - IBMPlexSansArabic-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtech732.dailywird
        GENERATE_INFOPLIST_FILE: NO
        # الأيقونة بأوضاعها الثلاثة (8.4، القرار 13، §17.5): Any وDark وTinted في AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        iCloud:
          CODE_SIGN_ENTITLEMENTS: Support/DailyWird-iCloud.entitlements
          CODE_SIGN_STYLE: Automatic
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIRD_ICLOUD
  DailyWirdTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: DailyWird
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  DailyWirdUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: DailyWird
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: DailyWird
schemes:
  DailyWird:
    build:
      targets:
        DailyWird: all
    test:
      targets:
        - DailyWirdTests
        - DailyWirdUITests
      language: ar
      region: SA
  # يُشغَّل ويُؤرشَف لـ TestFlight بحساب المطوّر المدفوع وحده (خطوات المالك في docs/reports/ش7-خطوات-iCloud.md).
  DailyWird iCloud:
    build:
      targets:
        DailyWird: all
    run:
      config: iCloud
    profile:
      config: iCloud
    analyze:
      config: iCloud
    archive:
      config: iCloud
