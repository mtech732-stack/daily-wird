# البناء والاختبار واللقطات (القسم 10.3).
# - كل طلب دمج: يبني للمحاكي، ويشغّل اختبارات الوحدة والواجهة على الهاتف الصغير نهاراً وحده،
#   ويلتقط لقطاته (القرار 24). والفحص الكامل (المقاسان نهاراً وليلاً) بوسم full-check على الطلب،
#   أو يدوياً من Actions، وفي كل دمج في main.
# - الأوضاع الأربعة في الفحص الكامل مهامّ متوازية، كلّ على جهاز (قطع حدُّ الستين دقيقة الفحصَ
#   متتابعاً في التشغيل 42940860983)، ثم تُجمع لقطاتها في مهمّة «screens» تبني صفحة اللقطات.
# - كل دمج في main: الشيء نفسه، ثم ينشر صفحة اللقطات على GitHub Pages.
# - وفي طلب الدمج تُرفع لقطاته إلى فرع previews (مجلّد pr-[رقم]) ليراها المالك قبل الدمج (القرار 11).
# بيئة مثبّتة صراحة (ملاحظة المعاين م2): صورة macos-26، وXcode 26.6، ومحاكيات iOS 26.5 بأسمائها.
# لا توقيع ولا أسرار في سير العمل: بناء iCloud يُترجَم هنا للمحاكي، ويوقَّع ويُؤرشَف على ماك المالك.
name: ci

on:
  pull_request:
    # «labeled»: وسم full-check على الطلب يشغّل الفحص الكامل (القرار 24).
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "الفحص الكامل: المقاسان نهاراً وليلاً (القرار 24)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  IOS_VERSION: "26.5"
  DEVICE_LARGE: iPhone 17 Pro Max
  DEVICE_SMALL: iPhone 17e

jobs:
  # طلب يغيّر المستندات وحدها (docs/ و design/ وملفات .md) لا يمسّ التطبيق، فلا تُشغَّل له
  # اختبارات الشاشات (اعتمده المالك 10 نوفمبر 08:37). ويبقى فحص «test» ظاهراً بحالة «تُخطّي»،
  # وهي تُحسب ناجحة فلا يتعطّل الدمج. والدمج في main يشغّل كل شيء دائماً.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      full: ${{ steps.plan.outputs.full }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        name: هل يمسّ الطلب التطبيق؟
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # --no-renames: نقل ملف من App/ إلى docs/ يُظهر الاسمين، فلا يُعفى من الاختبارات (المدقّق).
          # core.quotePath=false: الأسماء العربية تُطبع كما هي، لا بين تنصيص وبرموز ثُمانية لا تطابق docs/ ولا .md (م33).
          files=$(git -c core.quotePath=false diff --name-only --no-renames "$BASE...$HEAD")
          echo "$files"
          # يكفي ملف واحد خارج المستندات ليُعدّ الطلب ماسّاً للتطبيق.
          if printf '%s\n' "$files" | grep -qvE '^(docs/|design/)|\.md$'; then app=true; else app=false; fi
          echo "يمسّ التطبيق: $app"
          echo "app=$app" >> "$GITHUB_OUTPUT"
      - id: plan
        name: الأوضاع التي تُفحص (القرار 24)
        env:
          EVENT: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          set -euo pipefail
          # طلب الدمج: الصغير نهاراً وحده. والفحص الكامل بالأربعة: في main، وبوسم full-check، ويدوياً (افتراضيه كامل).
          full=true
          if [ "$EVENT" = "pull_request" ] && [[ ",$LABELS," != *",full-check,"* ]]; then full=false; fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_FULL" = "false" ]; then full=false; fi
          # «only» فارغ: كل الاختبارات (الوحدة والواجهة)؛ وإلا الواجهة وحدها للّقطات. والوحدة مرة واحدة في الفحص.
          if [ "$full" = true ]; then
            matrix='{"include":[{"key":"large","look":"light","only":""},{"key":"large","look":"dark","only":"DailyWirdUITests"},{"key":"small","look":"light","only":"DailyWirdUITests"},{"key":"small","look":"dark","only":"DailyWirdUITests"}]}'
          else
            matrix='{"include":[{"key":"small","look":"light","only":""}]}'
          fi
          echo "الفحص الكامل: $full"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  docs-only:
    needs: changes
    if: needs.changes.outputs.app != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "طلب مستندات وحدها، فلا اختبارات للشاشات."

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: test (${{ matrix.key }}-${{ matrix.look }})
    runs-on: macos-26
    # وضع واحد في كل مهمّة: البناء وتهيئة المحاكي وجولة واحدة، نحو 25 دقيقة. والحدّ احتياط.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      KEY: ${{ matrix.key }}
      LOOK: ${{ matrix.look }}
      ONLY: ${{ matrix.only }}
    steps:
      - uses: actions/checkout@v5

      - name: Xcode مثبّت
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          sw_vers

      - name: فحص بنية البيانات لـ CloudKit (4.4)
        run: python3 scripts/check-cloudkit-model.py App/Model/*.swift

      - name: فحص جدول الحدود قبل البناء عليه (6.3، م5)
        run: python3 data/tools/check_boundaries.py

      - name: توليد مشروع Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: تحديد المحاكي
        run: |
          set -euo pipefail
          if [ "$KEY" = large ]; then device="$DEVICE_LARGE"; else device="$DEVICE_SMALL"; fi
          udid=$(scripts/sim-udid.sh "$device" "$IOS_VERSION")
          echo "$device = $udid"
          echo "UDID=$udid" >> "$GITHUB_ENV"

      - name: البناء للاختبار
        run: |
          mkdir -p build
          xcodebuild build-for-testing \
            -project DailyWird.xcodeproj -scheme DailyWird \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO > build/build.log 2>&1 || {
              # أخطاء الترجمة نفسها، لا آخر 40 سطراً وحدها (تُخفي سبب الفشل).
              grep -E ": error:" -A 3 build/build.log | head -n 80
              tail -n 20 build/build.log
              exit 1
            }
          tail -n 20 build/build.log

      - name: بناء iCloud يُترجَم (ش7)
        # بناء iCloud بصلاحيته لا يوقَّع هنا (لا أسرار في سير العمل)، فيُترجَم وحده للمحاكي ليُعرف
        # أن كوده سليم. وفي مهمّة الوحدة وحدها، مرة واحدة في كل فحص.
        if: matrix.only == ''
        run: |
          xcodebuild build \
            -project DailyWird.xcodeproj -scheme "DailyWird iCloud" -configuration iCloud \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/dd-icloud \
            CODE_SIGNING_ALLOWED=NO > build/icloud.log 2>&1 || {
              grep -E ": error:" -A 3 build/icloud.log | head -n 80
              tail -n 20 build/icloud.log
              exit 1
            }
          grep -q "WIRD_ICLOUD" build/icloud.log && echo "بناء iCloud: ترجم بشرط WIRD_ICLOUD"
          tail -n 5 build/icloud.log

      - name: تهيئة المحاكي
        run: |
          # تهيئة المحاكي قبل اختباراته (اعتمده المالك 10 نوفمبر 08:37): أول تشغيل بعد إقلاع بارد
          # كان أبطأ بمرّتين، فتتأخّر فيه الورقة وسمات الإتاحة عن مهل الاختبار (#38، #40، #42، #45).
          # فيُقلع المحاكي، ويُثبَّت التطبيق ويُشغَّل مرة، ثم يجري اختبار واجهة قصير لتهيئة أداة الاختبار.
          # نتيجة التهيئة لا تُحتسب؛ والاختبار نفسه يجري ثانية في الجولة الحقيقية ويُحتسب فيها.
          set -euo pipefail
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          app=$(ls -d build/dd/Build/Products/*-iphonesimulator/DailyWird.app | head -n 1)
          xcrun simctl install "$UDID" "$app"
          bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          xcrun simctl launch "$UDID" "$bundle" -ui-testing || true
          sleep 20
          xcrun simctl terminate "$UDID" "$bundle" || true
          xcodebuild test-without-building \
            -project DailyWird.xcodeproj -scheme DailyWird \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            -only-testing:DailyWirdUITests/HomeScreenUITests/test_7_1_firstLaunchShowsThreeEmptyTracks \
            CODE_SIGNING_ALLOWED=NO > build/warm.log 2>&1 || echo "تهيئة: لم ينجح الاختبار التمهيدي (لا يُحتسب)"
          echo "تهيئة $UDID انتهت"

      - name: الاختبارات واللقطات
        run: |
          set -euo pipefail
          mkdir -p site/screens
          xcrun simctl ui "$UDID" appearance "$LOOK"
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          rb="build/r-$KEY-$LOOK.xcresult"
          xcodebuild test-without-building \
            -project DailyWird.xcodeproj -scheme DailyWird \
            -destination "id=$UDID" \
            -derivedDataPath build/dd \
            -resultBundlePath "$rb" \
            ${ONLY:+-only-testing:$ONLY} \
            CODE_SIGNING_ALLOWED=NO | grep -E "Test Case .*(passed|failed)|error:|\*\* TEST|تشخيص:"
          xcrun xcresulttool export attachments --path "$rb" --output-path "build/x-$KEY-$LOOK"
          python3 scripts/collect-shots.py "build/x-$KEY-$LOOK" site/screens "$KEY" "$LOOK"

      - name: رفع لقطات هذا الوضع
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ matrix.key }}-${{ matrix.look }}
          path: site/screens
          retention-days: 3

      - name: رفع نتائج الاختبار عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults-${{ matrix.key }}-${{ matrix.look }}
          path: build/*.xcresult
          retention-days: 7

  # تجمع لقطات الأوضاع كلها، ثم النسخ الرمادية وصفحة اللقطات ولقطات طلب الدمج (القرار 11).
  screens:
    needs: [changes, test]
    if: needs.changes.outputs.app == 'true' && needs.test.result == 'success'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: write # لرفع لقطات طلب الدمج إلى فرع previews وحده (القرار 11)
    env:
      FULL: ${{ needs.changes.outputs.full }}
    steps:
      - uses: actions/checkout@v5

      - name: لقطات الأوضاع مجتمعة
        uses: actions/download-artifact@v4
        with:
          pattern: shots-*
          path: site/screens
          merge-multiple: true

      - name: النسخ الرمادية وصفحة اللقطات
        run: |
          swift scripts/gray.swift site/screens
          python3 scripts/build-screens-page.py site/screens "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -d design ]; then cp -R design site/design; fi
          printf '%s\n' '<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=screens/"><title>الورد اليومي</title>' \
            '<a href="screens/">صفحة اللقطات</a></html>' > site/index.html
          ls -la site site/screens

      - name: فرع معاينة طلبات الدمج
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v5
        with:
          ref: previews
          path: pv
          fetch-depth: 1

      - name: لقطات طلب الدمج قبل دمجه (القرار 11)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true # المعاينة عون للمالك، ولا يفشل البناء بسببها
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr-out"
          python3 scripts/build-pr-preview.py site/screens "$out" "$PR" "$SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cd pv
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # الفرع إيداع واحد بلا تاريخ يُستبدل كل مرة، فلا يكبر المستودع بالصور.
          for i in 1 2 3 4 5; do
            git fetch -q --depth 1 origin previews
            base=$(git rev-parse FETCH_HEAD)
            git checkout -q -f -B work "$base"
            rm -rf "pr-$PR" && cp -R "$out" "pr-$PR"
            git add -A
            commit=$(git commit-tree "$(git write-tree)" -m "معاينة طلبات الدمج · #$PR ${SHA:0:7}")
            if git push -q --force-with-lease="previews:$base" origin "$commit:refs/heads/previews"; then
              echo "معاينة: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/previews/pr-$PR"
              exit 0
            fi
            sleep $((i * 3))
          done
          exit 1

      - name: رفع اللقطات (للمعاينة)
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: site/screens
          retention-days: 14

      - name: تجهيز صفحة اللقطات للنشر
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && needs.screens.result == 'success'
    needs: screens
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}screens/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
