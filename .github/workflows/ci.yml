# البناء والاختبار واللقطات (القسم 10.3).
# - كل طلب دمج: يبني للمحاكي، ويشغّل اختبارات الوحدة والواجهة، ويلتقط اللقطات ويرفعها ملفاً مرفقاً.
# - كل دمج في main: الشيء نفسه، ثم ينشر صفحة اللقطات على GitHub Pages.
# - وفي طلب الدمج تُرفع لقطاته إلى فرع previews (مجلّد pr-[رقم]) ليراها المالك قبل الدمج (القرار 11).
# بيئة مثبّتة صراحة (ملاحظة المعاين م2): صورة macos-26، وXcode 26.6، ومحاكيات iOS 26.5 بأسمائها.
# لا توقيع ولا أسرار حتى ش7.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  XCODE_APP: /Applications/Xcode_26.6.app
  IOS_VERSION: "26.5"
  DEVICE_LARGE: iPhone 17 Pro Max
  DEVICE_SMALL: iPhone 17e

jobs:
  # طلب يغيّر المستندات وحدها (docs/ و design/ وملفات .md) لا يمسّ التطبيق، فلا تُشغَّل له
  # اختبارات الشاشات (اعتمده المالك 10 نوفمبر 08:37). ويبقى فحص «test» ظاهراً بحالة «تُخطّي»،
  # وهي تُحسب ناجحة فلا يتعطّل الدمج. والدمج في main يشغّل كل شيء دائماً.
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        name: هل يمسّ الطلب التطبيق؟
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then echo "app=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # --no-renames: نقل ملف من App/ إلى docs/ يُظهر الاسمين، فلا يُعفى من الاختبارات (المدقّق).
          # core.quotePath=false: الأسماء العربية تُطبع كما هي، لا بين تنصيص وبرموز ثُمانية لا تطابق docs/ ولا .md (م33).
          files=$(git -c core.quotePath=false diff --name-only --no-renames "$BASE...$HEAD")
          echo "$files"
          # يكفي ملف واحد خارج المستندات ليُعدّ الطلب ماسّاً للتطبيق.
          if printf '%s\n' "$files" | grep -qvE '^(docs/|design/)|\.md$'; then app=true; else app=false; fi
          echo "يمسّ التطبيق: $app"
          echo "app=$app" >> "$GITHUB_OUTPUT"

  docs-only:
    needs: changes
    if: needs.changes.outputs.app != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "طلب مستندات وحدها، فلا اختبارات للشاشات."

  test:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write # لرفع لقطات طلب الدمج إلى فرع previews وحده (القرار 11)
    steps:
      - uses: actions/checkout@v5

      - name: Xcode مثبّت
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          sw_vers

      - name: فحص بنية البيانات لـ CloudKit (4.4)
        run: python3 scripts/check-cloudkit-model.py App/Model/*.swift

      - name: فحص جدول الحدود قبل البناء عليه (6.3، م5)
        run: python3 data/tools/check_boundaries.py

      - name: توليد مشروع Xcode (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen --version
          xcodegen generate

      - name: تحديد المحاكيين
        run: |
          set -euo pipefail
          large=$(scripts/sim-udid.sh "$DEVICE_LARGE" "$IOS_VERSION")
          small=$(scripts/sim-udid.sh "$DEVICE_SMALL" "$IOS_VERSION")
          echo "$DEVICE_LARGE = $large · $DEVICE_SMALL = $small"
          echo "UDID_LARGE=$large" >> "$GITHUB_ENV"
          echo "UDID_SMALL=$small" >> "$GITHUB_ENV"

      - name: البناء للاختبار
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project DailyWird.xcodeproj -scheme DailyWird \
            -destination "id=$UDID_LARGE" \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO | tail -n 40

      - name: الاختبارات واللقطات (مقاسان × نهاري وليلي)
        run: |
          set -euo pipefail
          mkdir -p site/screens
          run() { # $1 key  $2 udid  $3 appearance  $4 only-testing (اختياري)
            local key=$1 udid=$2 look=$3 only=${4:-}
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl ui "$udid" appearance "$look"
            xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
            local rb="build/r-$key-$look.xcresult"
            xcodebuild test-without-building \
              -project DailyWird.xcodeproj -scheme DailyWird \
              -destination "id=$udid" \
              -derivedDataPath build/dd \
              -resultBundlePath "$rb" \
              ${only:+-only-testing:$only} \
              CODE_SIGNING_ALLOWED=NO | grep -E "Test Case .*(passed|failed)|error:|\*\* TEST|تشخيص:"
            rm -rf "build/x-$key-$look"
            xcrun xcresulttool export attachments --path "$rb" --output-path "build/x-$key-$look"
            python3 scripts/collect-shots.py "build/x-$key-$look" site/screens "$key" "$look"
          }
          # تهيئة المحاكي قبل اختباراته (اعتمده المالك 10 نوفمبر 08:37): أول تشغيل بعد إقلاع بارد
          # كان أبطأ بمرّتين، فتتأخّر فيه الورقة وسمات الإتاحة عن مهل الاختبار (#38، #40، #42، #45).
          # فيُقلع المحاكي، ويُثبَّت التطبيق ويُشغَّل مرة، ثم يجري اختبار واجهة قصير لتهيئة أداة الاختبار.
          # نتيجة التهيئة لا تُحتسب؛ والاختبار نفسه يجري ثانية في الجولة الحقيقية ويُحتسب فيها.
          warm() { # $1 udid
            local udid=$1 app
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            app=$(ls -d build/dd/Build/Products/*-iphonesimulator/DailyWird.app | head -n 1)
            xcrun simctl install "$udid" "$app"
            bundle=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
            xcrun simctl launch "$udid" "$bundle" -ui-testing || true
            sleep 20
            xcrun simctl terminate "$udid" "$bundle" || true
            xcodebuild test-without-building \
              -project DailyWird.xcodeproj -scheme DailyWird \
              -destination "id=$udid" \
              -derivedDataPath build/dd \
              -only-testing:DailyWirdUITests/HomeScreenUITests/test_7_1_firstLaunchShowsThreeEmptyTracks \
              CODE_SIGNING_ALLOWED=NO > "build/warm-$udid.log" 2>&1 || echo "تهيئة: لم ينجح الاختبار التمهيدي (لا يُحتسب)"
            echo "تهيئة $udid انتهت"
          }
          # الجولة الأولى تشغّل كل الاختبارات (الوحدة والواجهة)، والبقية الواجهة وحدها للّقطات.
          warm "$UDID_LARGE"
          run large "$UDID_LARGE" light
          run large "$UDID_LARGE" dark  DailyWirdUITests
          xcrun simctl shutdown "$UDID_LARGE" || true
          warm "$UDID_SMALL"
          run small "$UDID_SMALL" light DailyWirdUITests
          run small "$UDID_SMALL" dark  DailyWirdUITests

      - name: النسخ الرمادية وصفحة اللقطات
        run: |
          swift scripts/gray.swift site/screens
          python3 scripts/build-screens-page.py site/screens "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ -d design ]; then cp -R design site/design; fi
          printf '%s\n' '<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8">' \
            '<meta http-equiv="refresh" content="0; url=screens/"><title>الورد اليومي</title>' \
            '<a href="screens/">صفحة اللقطات</a></html>' > site/index.html
          ls -la site site/screens

      - name: فرع معاينة طلبات الدمج
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v5
        with:
          ref: previews
          path: pv
          fetch-depth: 1

      - name: لقطات طلب الدمج قبل دمجه (القرار 11)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true # المعاينة عون للمالك، ولا يفشل البناء بسببها
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr-out"
          python3 scripts/build-pr-preview.py site/screens "$out" "$PR" "$SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cd pv
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # الفرع إيداع واحد بلا تاريخ يُستبدل كل مرة، فلا يكبر المستودع بالصور.
          for i in 1 2 3 4 5; do
            git fetch -q --depth 1 origin previews
            base=$(git rev-parse FETCH_HEAD)
            git checkout -q -f -B work "$base"
            rm -rf "pr-$PR" && cp -R "$out" "pr-$PR"
            git add -A
            commit=$(git commit-tree "$(git write-tree)" -m "معاينة طلبات الدمج · #$PR ${SHA:0:7}")
            if git push -q --force-with-lease="previews:$base" origin "$commit:refs/heads/previews"; then
              echo "معاينة: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/previews/pr-$PR"
              exit 0
            fi
            sleep $((i * 3))
          done
          exit 1

      - name: رفع نتائج الاختبار عند الفشل
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: build/*.xcresult
          retention-days: 7

      - name: رفع اللقطات (للمعاينة)
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: site/screens
          retention-days: 14

      - name: تجهيز صفحة اللقطات للنشر
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && needs.test.result == 'success'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}screens/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
